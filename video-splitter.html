<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Splitter</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a64;--ac:#c4562d;--acx:#fff;--bd:#e2e0d8;--ok:#2d7a4f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#161615;--card:#222220;--tx:#f0efe9;--mut:#9a988f;--ac:#e8794f;--acx:#161615;--bd:#363633;--ok:#5cc98a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#161615;--card:#222220;--tx:#f0efe9;--mut:#9a988f;--ac:#e8794f;--acx:#161615;--bd:#363633;--ok:#5cc98a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 14px}
.vp{margin:26px 0 8px}
.vp h2{font-size:1.15rem;margin:0 0 4px}
.vpg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:10px}
.vpc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.vpc .ic{font-size:1.4rem;margin-bottom:4px}
.vpc p{margin:4px 0 0;font-size:.88rem;color:var(--mut)}
footer{max-width:640px;margin:0 auto;padding:14px 16px 24px;border-top:1px solid var(--bd);color:var(--mut);font-size:.8rem;text-align:center}
footer b{color:var(--tx);font-size:.9rem}
footer p{margin:6px 0}
.support{margin:22px 0 8px;background:var(--card);border:1px solid var(--ac);border-radius:14px;padding:16px}
.support h2{font-size:1.1rem;margin:0 0 6px}
.support p{margin:0 0 12px;font-size:.92rem}
a.btn{display:inline-block;text-decoration:none;text-align:center;background:var(--ac);color:var(--acx);padding:10px 14px;border-radius:10px;font-weight:600}
.support a.btn{flex:1 1 auto}
.thx{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border:1px dashed var(--ac);border-radius:12px;font-size:.88rem}
.thx span{flex:1 1 180px}
footer a{color:var(--ac);font-weight:600;text-decoration:none}
.support .hint a{color:var(--mut)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
#lang{padding:8px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:.85rem;max-width:50%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
video{width:100%;max-height:45vh;border-radius:10px;background:#000;display:none;margin-top:10px}
button,input{font:inherit}
button{background:var(--ac);color:var(--acx);border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
#modes button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
button:disabled{opacity:.45;cursor:default}
input[type=text]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}
.row>*{flex:1 1 0;min-width:0}
.pick{position:relative;display:block;text-align:center;background:var(--ac);color:var(--acx);border-radius:10px;padding:14px;font-weight:600;overflow:hidden}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}
.seg{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:end}
label{font-size:.78rem;color:var(--mut);display:block;margin-bottom:3px}
.hint{color:var(--mut);font-size:.85rem;margin:6px 0}
.res{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.res span{font-size:.9rem;overflow-wrap:anywhere}
.res button{flex:none;padding:8px 12px}
#bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:10px;display:none}
#bar i{display:block;height:100%;width:0;background:var(--ok)}
#bar i.ind{width:40%!important;animation:mv 1s linear infinite alternate}
@keyframes mv{from{margin-left:0}to{margin-left:60%}}
#st{font-size:.9rem;color:var(--mut);margin-top:6px}
#autoMsg{color:var(--ok);font-weight:600}
</style>
</head>
<body>
<main>
<div class="top"><h1>✂️ <span data-i="title"></span></h1><select id="lang" aria-label="Language"><option value="id">Bahasa Indonesia</option><option value="en">English</option></select></div>

<div class="card">
  <div class="pick"><span data-i="pick"></span><input type="file" id="file" accept="video/*"></div>
  <video id="v" controls playsinline></video>
  <div class="hint" id="info"></div>
</div>

<div class="card">
  <div class="row" id="modes">
    <button class="sec on" data-m="man" data-i="man"></button>
    <button class="sec" data-m="dur" data-i="dur"></button>
    <button class="sec" data-m="num" data-i="num"></button>
  </div>

  <div id="auto" style="display:none">
    <div class="row">
      <div><label data-i="totL"></label><input type="text" id="totV" autocomplete="off" placeholder="05:30"></div>
      <div><label id="autoL"></label><input type="text" id="autoV" autocomplete="off" placeholder="01:00"></div>
    </div>
    <button id="gen" style="width:100%" data-i="gen"></button>
    <div class="hint" id="autoMsg"></div>
  </div>

  <div id="manualBar" class="row">
    <div><span data-i="pos"></span> <b id="cur">00:00</b></div>
    <button class="sec" id="setS" data-i="setS"></button>
    <button class="sec" id="setE" data-i="setE"></button>
  </div>

  <div class="hint" id="segHead" style="font-weight:600;color:var(--tx)"></div>
  <div id="segs"></div>
  <label style="display:flex;gap:8px;align-items:flex-start;color:var(--tx);font-size:.85rem;margin-bottom:10px"><input type="checkbox" id="fast" checked style="margin-top:3px"><span data-i="fastTxt"></span></label>
  <div class="row">
    <button class="sec" id="add" data-i="add"></button>
    <button id="go" disabled data-i="go"></button>
  </div>
  <div id="bar"><i></i></div>
  <div id="st"></div>
</div>

<div class="card" id="outCard" style="display:none"><b data-i="res"></b>
  <div id="allBar" style="display:none;margin:8px 0">
    <div class="row"><button id="zipAll" data-i="zipAll"></button><button class="sec" id="shareAll" style="display:none" data-i="shareAll"></button></div>
    <div class="hint" id="allMsg"></div>
  </div>
  <div id="out"></div>
  <div id="thanks" class="thx" style="display:none">
    <span data-i="thxT"></span>
    <a class="btn" href="https://sociabuzz.com/imaulana17/tribe" target="_blank" rel="noopener noreferrer" data-i="thxBtn"></a>
    <button class="sec" id="thxX" data-i="close" style="flex:none"></button>
  </div></div>

<p class="hint" data-i="foot"></p>
<section class="vp" aria-labelledby="vpH">
  <h2 id="vpH" data-i="vpH"></h2>
  <p class="hint" data-i="vpSub"></p>
  <div class="vpg"><div class="vpc"><div class="ic">⚡</div><b data-i="vp1t"></b><p data-i="vp1d"></p></div><div class="vpc"><div class="ic">🔒</div><b data-i="vp2t"></b><p data-i="vp2d"></p></div><div class="vpc"><div class="ic">🎛️</div><b data-i="vp3t"></b><p data-i="vp3d"></p></div><div class="vpc"><div class="ic">📦</div><b data-i="vp4t"></b><p data-i="vp4d"></p></div></div>
</section>
<section class="support" aria-labelledby="supH">
  <h2 id="supH" data-i="supH"></h2>
  <p data-i="supD"></p>
  <div class="row" style="align-items:center">
    <a class="btn" href="https://sociabuzz.com/imaulana17/tribe" target="_blank" rel="noopener noreferrer" data-i="supBtn"></a>
    <button class="sec" id="supCopy" data-i="supCopy"></button>
  </div>
  <div class="hint"><a href="https://sociabuzz.com/imaulana17/tribe" target="_blank" rel="noopener noreferrer">sociabuzz.com/imaulana17/tribe</a></div>
</section>
</main>
<footer>
  <b data-i="ftBrand"></b>
  <p data-i="ftNote"></p>
  <p><a href="https://sociabuzz.com/imaulana17/tribe" target="_blank" rel="noopener noreferrer" data-i="ftSupport"></a></p>
  <p data-i="ftCopy"></p>
</footer>

, or Firefox.", "recFail": "Recording failed", "e_stall": "Video stalled. Try Fast mode or another video.", "segInvalid": "Clip {0} is invalid. Use a format like 03:00 or 180. Start must be before end and within the video duration.", "needSeg": "Add at least one clip.", "procSlow": "Processing clip {0} of {1}…", "procFast": "Fast mode: processing clip {0} of {1}…", "fastFail": "Fast mode failed ({0}). Switching to precise mode (slower)…", "noteFast": " · fast", "done": "Done. Tap Save on each result.", "errPre": "Error: ", "save": "Save", "shareOne": "Share / Save to…", "saveHint": "If it did not download, use Share or the ⋮ menu on the player below.", "saveFail": "Could not save ({0}). Try Share or the ⋮ menu on the player below.", "saveFailAll": "Could not save ({0}). Try the Share button or save one by one.", "shareFail": "Share failed: {0}", "zipPrep": "Preparing ZIP…", "zipFail": "Could not create ZIP: {0}", "zipSuffix": "_clips.zip", "e_notmp4": "not a standard MP4/MOV", "e_frag": "fragmented MP4 is not supported", "e_notrack": "no video/audio track", "e_empty": "empty range", "e_big": "result too large", "e_zipbig": "ZIP too large", "e_slow": "took too long", "e_unplay": "result cannot be played", "vpH": "Why use Video Splitter?", "vpSub": "Cut videos right in your browser, with no upload and no extra app.", "vp1t": "Fast", "vp1d": "Fast mode cuts MP4/MOV without re-encoding, so results appear in seconds and the original quality is kept.", "vp2t": "Private", "vp2d": "Your video is never uploaded to a server. Everything runs on your device.", "vp3t": "Flexible", "vp3d": "Cut manually at the times you choose, by a fixed duration, or split into equal parts.", "vp4t": "Convenient", "vp4d": "No account and no install. Save clips one by one or download all results at once in a single ZIP.", "ftBrand": "Video Splitter", "ftNote": "Processed right on your device. Fast mode outputs MP4; precise mode outputs WebM or MP4 depending on your browser.", "ftCopy": "© 2026 Vi   name=f.name.replace(/\.[^.]+$/,'')||'video';curFile=f;

function checkVideo(blob){
  return new Promise(function(res){
    var t=document.createElement('video'),u=URL.createObjectURL(blob),done=false;
    function fin(ok){if(done)return;done=true;t.removeAttribute('src');URL.revokeObjectURL(u);res(ok)}

function pickType(){

  for(var i=0;i<c.length;i++){if(window.MediaRecorder&&MediaRecorder.isTypeSupported(c[i]))return c[i]}
  return '';

function record(a,b,onp){
  return new Promise(function(res,rej){
    var type=pickType(),tm;
    var stream=v.captureStream?v.captureStream():(v.mozCaptureStream&&v.mozCaptureStream());
    if(!stream||!window.MediaRecorder){rej(new Error('recUnsup'));return}
    var rec=new MediaRecorder(stream,type?{mimeType:type}:undefined),chunks=[];
    rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
    rec.onstop=function(){clearInterval(tm);v.pause();
      var mt=rec.mimeType||type||'video/webm';
      res({blob:new Blob(chunks,{type:mt}),ext:/mp4/.test(mt)?'mp4':'webm'})};
    rec.onerror=function(e){clearInterval(tm);rej(e.error||new Error('recFail'))};
    var started=false;
    var onSeek=function(){
      if(started)return;started=true;
      v.removeEventListener('seeked',onSeek);
      rec.start(500);
      v.play().catch(function(err){clearInterval(tm);if(rec.state!=='inactive')rec.stop();rej(err)});
      var lastT=-1,lastAt=Date.now();
      tm=setInterval(function(){
        onp((v.currentTime-a)/(b-a));
        if(v.currentTime!==lastT){lastT=v.currentTime;lastAt=Date.now()}
        else if(Date.now()-lastAt>8000){clearInterval(tm);if(rec.state!=='inactive')rec.stop();rej(new Error('e_stall'));return}
        if(v.currentTime>=b||v.ended){clearInterval(tm);if(rec.state!=='inactive')rec.stop()}

async function deliver(blob,fn,msg){
  msg.textContent='';
  function anchor(){var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},60000)}

  catch(e){
    if(e&&e.code==='declined')return;
    try{anchor()}catch(x){}
    msg.textContent=t('saveFailAll',(e&&(e.code||e.message))||e);
  }
}
function shareFiles(){return results.map(function(r){return new File([r.blob],r.fn,{type:r.blob.type})})}

  $('allBar').style.display=results.length>=2?'block':'none';

function addResult(blob,fn,note){
  results.push({blob:blob,fn:fn});
  $('outCard').style.display='block';
  var url=URL.createObjectURL(blob);
  var r=document.createElement('div');r.style.cssText='border-top:1px solid var(--bd);padding:10px 0';
  var sp=document.createElement('div');sp.style.cssText='font-size:.9rem;overflow-wrap:anywhere;margin-bottom:6px';
  sp.textContent=fn+' ('+(blob.size/1048576).toFixed(1)+' MB)'+(note||'');
  var tools=document.createElement('div');tools.className='row';tools.style.marginBottom='4px';
  var msg=document.createElement('div');msg.className='hint';
  function btn(k,f,c){var x=document.createElement('button');x.setAttribute('data-i',k);x.innerHTML=t(k);if(c)x.className=c;x.onclick=f;tools.appendChild(x)}
  function anchor(){var a=document.createElement('a');a.href=url;a.download=fn;document.body.appendChild(a);a.click();a.remove()}
  btn('save',async function(){
    msg.textContent='';
    try{
      if(dl){await dl.save({filename:fn,data:blob})}
      else{anchor();msg.textContent=t('saveHint')}
    }catch(e){
      if(e&&e.code==='declined')return;
      try{anchor()}catch(x){}
      msg.textContent=t('saveFail',(e&&(e.code||e.message))||e);
    }
  });
  try{
    if(navigator.canShare&&typeof File==='function'){
      var fl=new File([blob],fn,{type:blob.type});
      if(navigator.canShare({files:[fl]}))btn('shareOne',async function(){
        try{await navigator.share({files:[fl],title:fn})}catch(e){if(!e||e.name!=='AbortError')msg.textContent=t('shareFail',errMsg(e))}
      },'sec');
    }
  }catch(e){}
  var pv=document.createElement('video');pv.src=url;pv.controls=true;pv.playsInline=true;pv.preload='metadata';
  pv.style.cssText='display:block;width:100%;max-height:30vh;margin-top:6px';
  r.appendChild(sp);r.appendChild(tools);r.appendChild(msg);r.appendChild(pv);
  $('out').appendChild(r);
  updAll();
}

go.onclick=async function(){
  if(busy)return;
  var list=[],rows=segs.querySelectorAll('.seg');
  for(var i=0;i<rows.length;i++){
    var inp=rows[i].querySelectorAll('input'),a=num(inp[0]),b=num(inp[1]);
    if(isNaN(a)||isNaN(b)||a<0||b<=a||b>v.duration+0.3){st.textContent=t('segInvalid',i+1);return}
    list.push([a,Math.min(b,v.duration)]);
  }
  if(!list.length){st.textContent=t('needSeg');return}
  $('thanks').style.display='none';busy=true;go.disabled=true;bar.style.display='block';$('out').innerHTML='';results=[];$('allBar').style.display='none';$('allMsg').textContent='';
  try{
    for(var k=0;k<list.length;k++){
      st.textContent=t('procSlow',k+1,list.length);
      barI.style.width='0';
      var r=null,note='';
      if($('fast').checked&&curFile&&/\.(mp4|mov|m4v)$/i.test(curFile.name)){
        barI.classList.add('ind');
        st.textContent=t('procFast',k+1,list.length);
        await new Promise(function(x){setTimeout(x,30)});
        try{
          var fr=await Promise.race([fastSplit(curFile,list[k][0],list[k][1]),new Promise(function(_,rj){setTimeout(function(){rj(new Error('e_slow'))},60000)})]);

          r={blob:fr.blob,ext:'mp4'};note=t('noteFast');
        }catch(fe){st.textContent=t('fastFail',errMsg(fe))}
        barI.classList.remove('ind');
      }
      if(!r){r=await record(list[k][0],list[k][1],function(p){barI.style.width=Math.min(100,p*100)+'%'})}
      barI.style.width=((k+1)/list.length*100)+'%';
      addResult(r.blob,name+'_part'+(k+1)+'.'+r.ext,note);
    }
    st.textContent=t('done');if(!thxOff)$('thanks').style.display='flex';
  }catch(e){st.textContent=t('errPre')+errMsg(e)}
  busy=false;go.disabled=false;barI.style.width='100%';
};

};
